org.gradle.configuration-cache = true

# Cleanroom
# This build only works with Cleanroom 0.7.0 and above
cleanroom_version = 0.7.14-alpha

# Mod Information
# The version is computed from git tags by Versioning, run `gradlew -q printVersion` to see it
# Tag `1.0.0` to release it. A suffix on the tag picks the release type:
#   1.0.0-alpha    = alpha
#   1.0.0-beta     = beta
#   1.0.0-rc       = release candidate, uploaded to CurseForge and Modrinth as beta
#   1.0.0-release  = release, same as the bare `1.0.0`
# Untagged builds inherit the type of the highest staged tag in the same major version,
# else beta below 1.0.0 and release from there on
root_package = com.personthecat
mod_id = cleancaves
mod_name = Clean Caves

# Mod Metadata (Optional)
# Every property in the two sections above and below is a Token Envoy token, see tokens.properties
mod_description = A powerful and customizable modification of Mojang's overworld cave generator.
mod_url =
mod_update_json =
# Delimit authors with commas
mod_authors = PersonTheCat, Nicholas DellaGrotte
mod_credits = Based on Cave Generator by PersonTheCat
mod_logo_path =

# Run Configurations
# Delimit multiple JVM arguments with spaces
minecraft_username = Developer
extra_jvm_args =

# Access Transformers (Optional)
# File names under src/main/resources/META-INF, delimited with spaces, e.g. modid_at.cfg
# Clean Caves needs no access transformers
access_transformers =

# Coremod (Optional)
# Fully-qualified name of the class implementing IFMLLoadingPlugin
coremod_plugin_class =
# Set to false when the coremod jar has no @Mod class
coremod_includes_mod = true

# Mixin (Optional)
# Name of the refmap the Mixin config points at, e.g. mixins.modid.refmap.json
# Setting it adds the Mixin annotation processors and puts the refmap in both jars
cg.userdev.refmap =

# Publishing (Optional), ran by the release workflow through `publishMods`
# Provide secrets: CURSEFORGE_TOKEN, MODRINTH_TOKEN
# The CurseForge project ID is the numerical ID and not the slug
curseforge_project_id =
modrinth_project_id =

# Conventions (https://github.com/CleanroomMC/Conventions#configuration)
# One of: free (MIT), open (LGPLv3), visible (CleanroomMC License), none
# This mod is GPL-3.0 (see LICENSE), which Conventions does not manage
conventions.license = none
conventions.javaMajor = 25
# Code Style
# When true, `gradlew build` fails on a violation. The `Apply` tasks work either way
# The vendored org.hjson and fastnoise sources are excluded from all three tools in build.gradle
# Checkstyle, with the rules in checkstyle.xml
enable_checkstyle = false
# FormatJ and ClearSkies, fix with `gradlew clearSkiesApply formatJavaApply`
enable_formatting = false

# The branch release tags are cut from
versioning.releaseBranch = main
