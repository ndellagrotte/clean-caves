// You may write any gradle buildscript component in this file
// This file is automatically applied after build.gradle + dependencies.gradle is ran

// Unimined puts Minecraft, Forge and their libraries (log4j, commons, fastutil, ...) on the main
// source set's classpath only. The unit tests exercise plain-Java logic out of the same classes,
// so they need to see that classpath too -- without this, anything that so much as touches a
// Logger fails with NoClassDefFoundError at runtime rather than compiling cleanly and passing.
sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.compileClasspath
    }
}
